<div class="container py-5">

  <h2 class="text-center fw-bold mb-5">
    Our Products
  </h2>

  <div class="row g-4">

@for (item of data(); track item._id) {

  <div class="col-12 col-sm-6 col-lg-4">
          <div class="card h-100 shadow-sm"[routerLink]="['/Productdetails', item._id]" style="cursor: pointer;">

        <img
          [src]="item.imageCover"
          [alt]="item.title"
          class="card-img-top p-3"
          style="height: 250px; object-fit: contain;"
        >

        <div class="card-body d-flex flex-column">

          <h5 class="card-title">
            {{ item.title }}
          </h5>

          <p class="card-text text-muted">
            {{ item.description }}
          </p>

          <h5 class="text-warning mt-auto">
            ${{ item.price }}
          </h5>

        </div>

      </div>

  </div>
}  </div>

</div>
