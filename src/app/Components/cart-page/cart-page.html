<div class="container py-4 cart-container">

  <h2 class="fw-bold mb-4">My Cart</h2>

  @if (cart.items().length === 0) {
    <div class="text-center py-5">
      <p class="text-muted fs-5">Your cart is empty.</p>
      <a routerLink="/Products" class="btn btn-dark">Browse Products</a>
    </div>
  } @else {

    @for (item of cart.items(); track item.id) {
      <div class="cart-item border-bottom py-3">

        <img [src]="item.imageCover" [alt]="item.title" class="cart-img">

        <div class="cart-info">
          <h6 class="mb-1 text-truncate">{{ item.title }}</h6>
          <small class="text-muted">{{ item.price }} EGP</small>
        </div>

        <div class="cart-controls d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-dark" type="button"
            (click)="cart.decrease(item.id)">−</button>
          <span class="fw-bold px-2">{{ item.quantity }}</span>
          <button class="btn btn-sm btn-outline-dark" type="button"
            (click)="cart.increase(item.id)">+</button>
        </div>

        <div class="fw-bold item-total">{{ item.price * item.quantity }} EGP</div>

        <button class="btn btn-sm btn-outline-danger" type="button"
          (click)="cart.remove(item.id)">Remove</button>
      </div>
    }

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mt-4">
      <button class="btn btn-outline-secondary" type="button" (click)="cart.clear()">
        Clear Cart
      </button>
      <h4 class="mb-0">Total: <span class="text-danger">{{ cart.total() }} EGP</span></h4>
    </div>

  }
</div>
